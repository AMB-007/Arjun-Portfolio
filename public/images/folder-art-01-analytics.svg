<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#C084FC" stopOpacity="0.8"/>
      <stop offset="50%" stopColor="#818CF8" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#4C1D95" stopOpacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#E9D5FF"/>
      <stop offset="100%" stopColor="#7E22CE"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#C8F31D"/>
      <stop offset="100%" stopColor="#4D7C0F"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#818CF8"/>
      <stop offset="100%" stopColor="#C8F31D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient background radiance -->
  <circle cx="300" cy="300" r="200" fill="url(#purpleGlow)" filter="url(#softGlow)"/>

  <!-- Isometric Base Grid -->
  <g transform="translate(100, 240) rotate(-15) skewX(20)" opacity="0.35" stroke="#E9D5FF" stroke-width="1.5">
    <line x1="0" y1="50" x2="360" y2="50"/>
    <line x1="0" y1="100" x2="360" y2="100"/>
    <line x1="0" y1="150" x2="360" y2="150"/>
    <line x1="0" y1="200" x2="360" y2="200"/>
    <line x1="60" y1="0" x2="60" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="240"/>
    <line x1="330" y1="0" x2="330" y2="240"/>
  </g>

  <!-- Isometric 3D Analytics Bars -->
  <!-- Bar 1 -->
  <g transform="translate(180, 260)">
    <path d="M 0 60 L 35 40 L 70 60 L 35 80 Z" fill="#D8B4FE"/>
    <path d="M 0 60 L 35 80 L 35 180 L 0 160 Z" fill="#9333EA"/>
    <path d="M 35 80 L 70 60 L 70 160 L 35 180 Z" fill="#6B21A8"/>
  </g>

  <!-- Bar 2 (Taller, Highlighted in Lime) -->
  <g transform="translate(250, 180)">
    <path d="M 0 60 L 35 40 L 70 60 L 35 80 Z" fill="#ECFCCB"/>
    <path d="M 0 60 L 35 80 L 35 260 L 0 240 Z" fill="#C8F31D"/>
    <path d="M 35 80 L 70 60 L 70 240 L 35 260 Z" fill="#65A30D"/>
  </g>

  <!-- Bar 3 -->
  <g transform="translate(320, 220)">
    <path d="M 0 60 L 35 40 L 70 60 L 35 80 Z" fill="#E9D5FF"/>
    <path d="M 0 60 L 35 80 L 35 220 L 0 200 Z" fill="#A855F7"/>
    <path d="M 35 80 L 70 60 L 70 200 L 35 220 Z" fill="#7E22CE"/>
  </g>

  <!-- Dynamic Ascending Regression Vector Line -->
  <path d="M 160 380 Q 240 320 285 220 T 430 130" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- High-Precision Metric Data Points -->
  <circle cx="160" cy="380" r="6" fill="#C8F31D" stroke="#000" stroke-width="2"/>
  <circle cx="285" cy="220" r="8" fill="#FFFFFF" stroke="#C8F31D" stroke-width="3"/>
  <circle cx="430" cy="130" r="10" fill="#C8F31D" stroke="#FFFFFF" stroke-width="3" filter="url(#softGlow)"/>

  <!-- Floating Data Node Ring -->
  <circle cx="430" cy="130" r="22" fill="none" stroke="#C8F31D" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
