<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stopColor="#D6B979" stopOpacity="0.18"/>
      <stop offset="45%" stopColor="#3B3F9E" stopOpacity="0.15"/>
      <stop offset="100%" stopColor="#07080C" stopOpacity="1"/>
    </radialGradient>
    <linearGradient id="champagneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D6B979"/>
      <stop offset="50%" stopColor="#F0DDA8"/>
      <stop offset="100%" stopColor="#9C7F3F"/>
