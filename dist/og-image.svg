  <g transform="translate(90, 110)">
    <rect width="390" height="34" rx="17" fill="#0D0F14" stroke="#D6B979" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#D6B979"/>
    <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#D6B979" letter-spacing="1.5">DATA ANALYST &amp; ML // B.TECH CSE</text>
  </g>

  <!-- Headline -->
  <text x="90" y="235" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#F3EFE6" letter-spacing="-1.5">
    Arjun M Babu
  </text>
  <text x="90" y="305" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#D6B979" letter-spacing="-0.5">
    Data Analyst &amp; Machine Learning Engineer
  </text>

  <!-- Subtitle -->
  <text x="90" y="375" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#A8A59C">
