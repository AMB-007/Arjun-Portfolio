<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stopColor="#2F6FEB" stopOpacity="0.12"/>
      <stop offset="100%" stopColor="#0B0F17" stopOpacity="1"/>
    </radialGradient>
  </defs>

  <!-- Deep Midnight Slate Background -->
  <rect width="1200" height="630" fill="#0B0F17"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Card Border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1.5" fill="#101725" fill-opacity="0.4"/>

  <!-- Header Eyebrow -->
  <g transform="translate(90, 110)">
    <rect width="360" height="34" rx="17" fill="#162033" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#2DD4BF"/>
    <text x="36" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E8ECF3">Open to Data Analyst &amp; ML roles</text>
  </g>

  <!-- Headline -->
  <text x="90" y="235" font-family="'Inter', sans-serif" font-size="64" font-weight="800" fill="#E8ECF3" letter-spacing="-1.5">
    Arjun M Babu
  </text>
  <text x="90" y="305" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#6EA8FF" letter-spacing="-0.5">
