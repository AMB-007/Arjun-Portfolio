<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="ogGlow" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stopColor="#C8F31D" stopOpacity="0.18"/>
      <stop offset="50%" stopColor="#1E1B4B" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#060608" stopOpacity="1"/>
    </radialGradient>
    <linearGradient id="iridescentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="25%" stopColor="#F97316"/>
      <stop offset="50%" stopColor="#22C55E"/>
      <stop offset="75%" stopColor="#D946EF"/>
      <stop offset="100%" stopColor="#C8F31D"/>
    </linearGradient>
  </defs>

  <!-- Deep Void Background -->
  <rect width="1200" height="630" fill="#060608"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Card Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Header Eyebrow -->
  <g transform="translate(90, 110)">
    <rect width="360" height="34" rx="17" fill="#141418" stroke="#C8F31D" stroke-width="1"/>
    <circle cx="20" cy="17" r="4.5" fill="#C8F31D"/>
    <text x="36" y="22" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#C8F31D" letter-spacing="1.5">DATA SCIENCE &amp; ML // MCA</text>
  </g>

  <!-- Headline -->
  <text x="90" y="235" font-family="'Inter', sans-serif" font-size="64" font-weight="900" fill="#F4F4F5" letter-spacing="-1.5">
    Arjun M Babu
  </text>
  <text x="90" y="305" font-family="'Inter', sans-serif" font-size="34" font-weight="600" fill="#C8F31D" letter-spacing="-0.5">
    I turn data into decisions.
  </text>

  <!-- Subtitle -->
  <text x="90" y="375" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#8B8B93">
    Master of Computer Applications (MCA) • Python • SQL • Machine Learning Ensembles
  </text>
  <text x="90" y="415" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#8B8B93">
    Deep Learning • Computer Vision • SHAP Explainability • Power BI Dashboards
  </text>

  <!-- Footer Meta -->
  <g transform="translate(90, 490)">
    <rect width="260" height="42" rx="8" fill="#141418" stroke="rgba(255,255,255,0.15)"/>
    <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#F4F4F5">
      arjun-m-babu.vercel.app
    </text>
  </g>

  <!-- Verified Badge -->
  <g transform="translate(920, 490)">
    <text x="0" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#8B8B93">
      // VERIFIED PORTFOLIO
    </text>
  </g>
</svg>

